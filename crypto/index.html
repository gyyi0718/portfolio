<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>크립토 전략 연구</title>
<style>
:root{color-scheme:light;--bg:#f7f6f3;--card:#fdfdfc;--ink:#12110f;--ink2:#4e4c47;--line:#dedcd4;--accent:#1f5f8b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e0e0d;--card:#1a1a18;--ink:#f5f4f1;--ink2:#bab7ae;--line:#2e2d2a;--accent:#5fa8d8}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:18px 16px 0;max-width:1000px;width:100%;margin:0 auto}
h1{font-size:21px;margin:0 0 2px}p.s{margin:0 0 14px;color:var(--ink2);font-size:13.5px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:10px 16px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style></head><body>
<header>
<h1>크립토 전략 연구</h1>
<p class="s">바이낸스 선물·현물 실데이터 기반 자동매매 전략 백테스트와 검증 · 개인 연구 자료이며 투자 권유가 아닙니다</p>
<nav>
<a href="#validation" data-src="strategy-validation.html">전략 검증 보고서</a>
<a href="#two-track" data-src="two-track-projection.html">방어·공격 투트랙 투영</a>
</nav>
</header>
<iframe id="v" title="보고서"></iframe>
<script>
const tabs=[...document.querySelectorAll('nav a')],f=document.getElementById('v');
function show(){const h=location.hash||'#validation';const t=tabs.find(a=>a.getAttribute('href')===h)||tabs[0];
tabs.forEach(a=>a.classList.toggle('on',a===t));if(f.getAttribute('src')!==t.dataset.src)f.setAttribute('src',t.dataset.src);document.title=t.textContent+' · 크립토 전략 연구';}
addEventListener('hashchange',show);show();
</script>
</body></html>
